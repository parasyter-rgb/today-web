<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Today MMO (ข้อ 47): เกมเต็มหน้าต่างเบราว์เซอร์เสมอ · คอม+มือถือ · ไม่มีแถบ Unity -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a1830">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Project Today</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div id="loading-box">
          <div id="loading-title">Project Today</div>
          <div id="loading-bar"><div id="loading-fill"></div></div>
          <div id="loading-text">กำลังโหลดเกม... <span id="loading-pct">0%</span></div>
        </div>
      </div>
      <div id="warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                   (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPad รุ่นใหม่บอกว่าเป็น Mac

      // ข้อความเตือน/ผิดพลาดจาก Unity: แถบบนจอ (error ค้างไว้ · อื่นๆ หายเองใน 5 วิ)
      function showBanner(msg, type) {
        var box = document.querySelector("#warning");
        var div = document.createElement("div");
        div.className = "banner " + (type || "");
        div.textContent = msg;
        box.appendChild(div);
        if (type !== "error") setTimeout(function () { div.remove(); }, 5000);
      }

      // ภาพคมตามจอ · มือถือจำกัดไม่เกิน 2 เท่า (กันเครื่องหนัก/ร้อน)
      function pixelRatio() {
        var r = window.devicePixelRatio || 1;
        return mobile ? Math.min(r, 2) : r;
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "game", // ปุ่ม "เต็มจอ" ในเกม → เต็มจอทั้งกรอบเกม
        companyName: "DefaultCompany",
        productName: "Project Today",
        productVersion: "0.1.0",
        showBanner: showBanner,
        devicePixelRatio: pixelRatio(),
        // Unity ปรับขนาดภาพตามขนาดกรอบ canvas เอง (matchWebGLToCanvasSize ค่าเริ่ม = true)
      };

      // หมุนจอ/ย้ายไปจอที่ความละเอียดต่างกัน → อัปเดตความคม
      var unity = null;
      function onResize() {
        config.devicePixelRatio = pixelRatio();
        if (unity && unity.Module) unity.Module.devicePixelRatio = config.devicePixelRatio;
      }
      window.addEventListener("resize", onResize);
      window.addEventListener("orientationchange", function () { setTimeout(onResize, 200); });


      var script = document.createElement("script");
      script.src = buildUrl + "/Web.loader.js";
      script.onload = function () {
        var loading = document.querySelector("#loading");
        var fill = document.querySelector("#loading-fill");
        var pct = document.querySelector("#loading-pct");
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
          pct.textContent = Math.round(100 * progress) + "%";
        }).then(function (instance) {
          unity = instance;
          loading.classList.add("done");
          setTimeout(function () { loading.style.display = "none"; }, 400);
          canvas.focus();
        }).catch(function (message) {
          document.querySelector("#loading-text").textContent = "โหลดเกมไม่สำเร็จ: " + message;
        });
      };
      script.onerror = function () {
        document.querySelector("#loading-text").textContent = "โหลดเกมไม่สำเร็จ — ลองรีเฟรชหน้าเว็บ";
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
